<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1627">
<title>Thanks for a great year! — 22nd Regional Board</title>
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg-1: #0a0f24;
    --bg-2: #1a0a3a;
    --bg-3: #3a0a4a;
    --accent-1: #ff6ec7;   /* pink */
    --accent-2: #7873f5;   /* purple */
    --accent-3: #4fd3ff;   /* cyan */
    --accent-4: #ffd86b;   /* gold */
    --ink: #ffffff;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
    background-size: 400% 400%;
    animation: bgshift 18s ease-in-out infinite;
    min-height: 100vh;
    display: grid;
    place-items: center;
    text-align: center;
    position: relative;
  }

  @keyframes bgshift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* ——— starfield / sparkles ——— */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .stars::before, .stars::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.9), transparent),
      radial-gradient(1.5px 1.5px at 70% 60%, rgba(255,255,255,0.8), transparent),
      radial-gradient(2px 2px at 40% 80%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 85% 25%, rgba(255,255,255,0.9), transparent),
      radial-gradient(1.5px 1.5px at 10% 70%, rgba(255,255,255,0.85), transparent),
      radial-gradient(2px 2px at 55% 15%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1.5px 1.5px at 30% 50%, rgba(255,255,255,0.75), transparent);
    animation: twinkle 3.5s ease-in-out infinite alternate;
  }
  .stars::after {
    background-image:
      radial-gradient(1.5px 1.5px at 15% 60%, rgba(255,216,107,0.9), transparent),
      radial-gradient(2px 2px at 65% 35%, rgba(255,110,199,0.85), transparent),
      radial-gradient(1px 1px at 88% 55%, rgba(79,211,255,0.9), transparent),
      radial-gradient(1.5px 1.5px at 35% 90%, rgba(120,115,245,0.8), transparent),
      radial-gradient(2px 2px at 75% 75%, rgba(255,216,107,0.7), transparent);
    animation-delay: 1.5s;
    animation-duration: 4.5s;
  }
  @keyframes twinkle {
    from { opacity: 0.35; transform: scale(0.95); }
    to   { opacity: 1;    transform: scale(1.05); }
  }

  /* ——— floating glow blobs ——— */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
  }
  .blob.b1 { width: 480px; height: 480px; background: var(--accent-1); top: -120px; left: -120px; animation: float1 12s ease-in-out infinite; }
  .blob.b2 { width: 520px; height: 520px; background: var(--accent-2); bottom: -160px; right: -120px; animation: float2 14s ease-in-out infinite; }
  .blob.b3 { width: 380px; height: 380px; background: var(--accent-3); top: 50%; left: 60%; transform: translate(-50%,-50%); animation: float3 16s ease-in-out infinite; opacity: 0.4; }

  @keyframes float1 {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(60px, 80px) scale(1.1); }
  }
  @keyframes float2 {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(-80px, -60px) scale(1.15); }
  }
  @keyframes float3 {
    0%,100% { transform: translate(-50%,-50%) scale(1); }
    50%     { transform: translate(-40%,-60%) scale(1.2); }
  }

  /* ——— main content ——— */
  .stage {
    position: relative;
    z-index: 2;
    padding: 0 24px;
    max-width: 1100px;
    width: 100%;
    animation: rise 1.2s cubic-bezier(0.2, 0.9, 0.3, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-size: clamp(13px, 1.6vw, 16px);
    letter-spacing: 0.6em;
    text-transform: uppercase;
    opacity: 0.85;
    margin-bottom: 28px;
    animation: rise 1.4s 0.2s both;
  }

  h1.title {
    margin: 0;
    font-weight: 900;
    letter-spacing: -0.02em;
    font-size: clamp(44px, 9vw, 132px);
    line-height: 0.95;
    background: linear-gradient(110deg,
      var(--accent-1) 0%,
      var(--accent-4) 25%,
      var(--accent-3) 50%,
      var(--accent-2) 75%,
      var(--accent-1) 100%);
    background-size: 300% 100%;
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 6s ease-in-out infinite, rise 1.4s 0.1s both;
    text-shadow: 0 0 40px rgba(255,110,199,0.25);
    filter: drop-shadow(0 4px 24px rgba(0,0,0,0.45));
  }

  @keyframes shine {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .signature {
    margin-top: 36px;
    font-size: clamp(18px, 2.4vw, 32px);
    font-weight: 600;
    letter-spacing: 0.04em;
    opacity: 0;
    animation: rise 1.4s 0.6s both;
  }
  .signature .em-dash {
    color: var(--accent-4);
    margin: 0 8px;
  }
  .signature .board {
    background: linear-gradient(90deg, var(--accent-3), var(--accent-1));
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
  }

  .heart {
    display: inline-block;
    color: var(--accent-1);
    margin: 0 6px;
    animation: heart 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 12px rgba(255,110,199,0.6));
  }
  @keyframes heart {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.15); }
  }

  .hr {
    width: 80px;
    height: 4px;
    margin: 36px auto 0;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-3));
    box-shadow: 0 0 24px rgba(120,115,245,0.6);
    opacity: 0;
    animation: rise 1.4s 0.8s both;
  }

  /* ——— confetti pieces ——— */
  .confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  .confetti i {
    position: absolute;
    top: -20px;
    width: 10px;
    height: 18px;
    border-radius: 2px;
    opacity: 0;
    animation: fall linear infinite;
    transform-origin: center;
  }
  @keyframes fall {
    0%   { transform: translateY(-10vh) rotate(0deg);   opacity: 0; }
    8%   { opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.9; }
  }

  /* ——— trophy emoji at top ——— */
  .crown {
    font-size: clamp(48px, 7vw, 84px);
    margin-bottom: 8px;
    filter: drop-shadow(0 6px 24px rgba(255,216,107,0.6));
    animation: bob 3.5s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes bob {
    0%,100% { transform: translateY(0) rotate(-3deg); }
    50%     { transform: translateY(-10px) rotate(3deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>

<div class="stars"></div>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<div class="confetti" id="confetti"></div>

<main class="stage" role="main">
  <div class="crown">🏆</div>
  <div class="eyebrow">Gold Coast Region · BBYO</div>
  <h1 class="title">Thanks for a<br>great year!</h1>
  <div class="hr"></div>
  <p class="signature">
    <span class="em-dash">—</span>
    <span class="board">22nd Regional Board</span>
    <span class="heart">♥</span>
  </p>
</main>

<script>
  // Generate confetti pieces with randomized colors, positions, durations.
  (function spawnConfetti() {
    const colors = ['#ff6ec7', '#7873f5', '#4fd3ff', '#ffd86b', '#ffffff'];
    const root = document.getElementById('confetti');
    const N = 60;
    const frag = document.createDocumentFragment();
    for (let i = 0; i < N; i++) {
      const piece = document.createElement('i');
      const left = Math.random() * 100;
      const dur = 6 + Math.random() * 8;
      const delay = -Math.random() * 14;
      const size = 6 + Math.random() * 10;
      const skew = (Math.random() * 60 - 30) | 0;
      piece.style.left = left + 'vw';
      piece.style.width = size + 'px';
      piece.style.height = (size * 1.7) + 'px';
      piece.style.background = colors[i % colors.length];
      piece.style.animationDuration = dur + 's';
      piece.style.animationDelay = delay + 's';
      piece.style.transform = 'rotate(' + skew + 'deg)';
      piece.style.opacity = (0.6 + Math.random() * 0.4).toFixed(2);
      frag.appendChild(piece);
    }
    root.appendChild(frag);
  })();
</script>

</body>
</html>
